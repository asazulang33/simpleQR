<title>교보생명 신용대출 간편조회</title>

<meta property="og:title" content="교보생명 신용대출 간편조회">
<meta property="og:description" content="보험계약자 전용 신용대출 한도, 금리 확인">
<script>
  /* 카카오톡 메시지의 버튼으로 들어오면(?go=1) 곧바로 교보생명 간편조회 페이지로 이동 */
  if (/[?&]go=1(&|$)/.test(location.search)) location.replace("https://www.kyobo.com/dgt/web/loan/credit/credit-loan-step1");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#15191e; --ink2:#3a434d; --line:#e3e7eb;
    --primary:#1f6feb; --soft:#eef3fb;
    --kakao:#fee500; --kakao-ink:#191600; --sms:#22b45a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
        padding:calc(20px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}

  /* 1. 타이틀 */
  .titlebar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .title{font-size:26px;font-weight:800;color:#2e7d15;line-height:1.25;letter-spacing:-.03em;white-space:nowrap;padding-top:6px}
  .titlebar .logo{flex:none;height:34px;width:auto;display:block}

  /* 2. 부제 */
  h1{margin-top:18px;font-size:29px;line-height:1.32;font-weight:800;letter-spacing:-.03em}
  h1 em{font-style:normal;color:var(--primary)}

  /* 공통 섹션 */
  .sec{margin-top:16px;background:var(--card);border:1.5px solid #dde3ea;border-radius:18px;padding:16px}
  .sec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:10px}
  .sec-h .tag{padding:4px 12px;border-radius:8px;font-size:15px;font-weight:800}

  /* 3. 대상 */
  .target .tag{background:var(--primary);color:#fff}
  .target ul{list-style:none;display:grid;gap:8px}
  .target li{display:flex;align-items:center;gap:10px;font-size:18.5px;font-weight:800}
  .target li svg{flex:none;width:24px;height:24px;color:var(--primary)}

  /* 4. 주의사항 */
  .caution .tag{background:#ffb020;color:#3d2800}
  .caution ul{list-style:none;display:grid;gap:8px}
  .caution li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5;letter-spacing:-.025em;color:var(--ink);
       padding:10px 12px;border-radius:12px}
  .caution li svg{flex:none;width:17px;height:17px;margin-top:2px}
  .caution .ok{background:#ecf8f1}
  .caution .ok svg{color:#127a46}
  .caution .warn{background:#fff4dc;color:#5f3a00}
  .caution b{font-weight:800;color:var(--ink)}
  .caution .warn b{color:#5f3a00}

  /* 조회 버튼 */
  .go-btn{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border-radius:16px;
        background:var(--primary);color:#fff;font-size:21px;font-weight:800;text-decoration:none;
        box-shadow:0 8px 18px rgba(31,111,235,.3);transition:transform .08s}
  .go-btn:active{transform:scale(.98)}
  .go-btn svg{width:22px;height:22px}
  .go-btn:focus-visible{outline:3px solid #9cc1ff;outline-offset:2px}

  /* 5. 링크 공유 */
  .share{margin-top:16px}
  .share-h{font-size:17px;font-weight:800;margin-bottom:10px;padding-left:2px}
  .share-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;border:0;
        font:inherit;font-size:20px;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .08s}
  .sbtn:active{transform:scale(.97)}
  .sbtn svg{width:24px;height:24px;flex:none}
  .sbtn-sms{background:var(--sms);color:#fff;box-shadow:0 6px 14px rgba(34,180,90,.25)}
  .sbtn-kakao{background:var(--kakao);color:var(--kakao-ink);box-shadow:0 6px 14px rgba(200,170,0,.25)}
  .sbtn:focus-visible{outline:3px solid #9cc1ff;outline-offset:2px}

  .disclaimer{margin-top:14px;font-size:12px;color:#7b848d;line-height:1.5;text-align:center}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
         max-width:calc(100% - 32px);background:#15191e;color:#fff;font-size:14px;padding:12px 18px;border-radius:14px;
         opacity:0;pointer-events:none;transition:all .2s;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:400px){
    .title{font-size:24.5px}
  }
  @media (max-width:375px){
    .title{font-size:22px;padding-top:4px}
    .titlebar .logo{height:30px}
    h1{font-size:26px}
  }
  @media (max-height:799px){
    .wrap{padding-top:calc(14px + env(safe-area-inset-top))}
    h1{margin-top:14px;font-size:25px}
    .sec{margin-top:12px;padding:13px 14px}
    .sec-h{margin-bottom:8px}
    .sec-h .tag{font-size:14px;padding:3px 10px}
    .target ul,.caution ul{gap:6px}
    .target li{font-size:17px}
    .caution li{font-size:13.5px;padding:8px 10px;line-height:1.45}
    .go-btn{margin-top:12px;min-height:56px;font-size:19px}
    .share{margin-top:12px}
    .share-h{font-size:16px;margin-bottom:8px}
    .sbtn{min-height:52px;font-size:18px}
  }
</style>
</head>

<!-- 카카오 JavaScript SDK (카카오톡 공유) -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  /* ===================== 여기만 수정하세요 ===================== */
  var KAKAO_JS_KEY = "";   // 카카오 디벨로퍼스 JavaScript 키 (넣으면 카카오톡으로만 공유됩니다)
  var FP_NAME = "";        // 추천 FP 이름 (선택, 예: "홍길동")
  var FP_CODE = "";        // 추천 FP 코드 (선택)
  var KYOBO_URL = "https://www.kyobo.com/dgt/web/loan/credit/credit-loan-step1";
  var SHARE_TITLE = "교보생명 신용대출 간편조회";
  var SHARE_TEXT = "보험계약자 전용 신용대출 한도, 금리 확인";
  var SHARE_ASK = "조회 후 FP 추천인 입력 부탁드려요.";
  /* ============================================================= */

  var toastEl = document.getElementById("toast"), timer;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(timer); timer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2800);
  }

  var fpLine = FP_NAME ? "\n추천 FP: " + FP_NAME + (FP_CODE ? " (" + FP_CODE + ")" : "") : "";
  var MESSAGE = SHARE_TITLE + "\n" + SHARE_TEXT + "\n\n" + SHARE_ASK + fpLine + "\n\n" + KYOBO_URL;

  /* 문자: 휴대폰 문자 앱이 메시지가 입력된 채로 열리고, 받는 사람을 고를 수 있습니다. */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.getElementById("smsBtn").href = (isIOS ? "sms:&body=" : "sms:?body=") + encodeURIComponent(MESSAGE);

  /* 카카오톡 공유
     - JavaScript 키가 있으면: 카카오톡이 바로 열리고 친구·채팅방을 골라 보냅니다(다른 앱은 안 나옵니다).
       메시지의 "한도·금리 조회하기" 버튼 → 이 페이지(?go=1) → 즉시 교보생명 간편조회 페이지로 이동.
       (카카오 메시지 버튼은 카카오에 등록한 도메인으로만 연결할 수 있어서 이렇게 거쳐 갑니다.)
     - 키가 없으면: 임시로 휴대폰 공유창을 띄웁니다. */
  var KAKAO_LINK = location.origin + location.pathname + "?go=1";
  var kakaoReady = false;
  try {
    if (KAKAO_JS_KEY && window.Kakao) {
      if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
      kakaoReady = Kakao.isInitialized();
    }
  } catch(e) {}

  function copyFallback(){
    var ta = document.createElement("textarea");
    ta.value = MESSAGE; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
    var ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    document.body.removeChild(ta);
    toast(ok ? "메시지를 복사했어요. 카카오톡에 붙여넣어 주세요." : "휴대폰 기본 브라우저로 열어 주세요.");
  }

  document.getElementById("kakaoBtn").addEventListener("click", function(){
    if (kakaoReady) {
      try {
        Kakao.Share.sendDefault({
          objectType: "text",
          text: SHARE_TITLE + "\n" + SHARE_TEXT + "\n\n" + SHARE_ASK + fpLine,
          link: { mobileWebUrl: KAKAO_LINK, webUrl: KAKAO_LINK },
          buttonTitle: "한도·금리 조회하기"
        });
      } catch(e) { toast("카카오톡을 열지 못했어요. 잠시 후 다시 시도해 주세요."); }
      return;
    }
    if (navigator.share) {
      navigator.share({ text: MESSAGE }).catch(function(err){
        if (!err || err.name !== "AbortError") copyFallback();
      });
    } else { copyFallback(); }
  });
})();
</script>
